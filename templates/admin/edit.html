{% extends 'base.html' %}
{% block title %}Edit - {{ article.title }}{% endblock %}
{% block content %}
  <h1>Edit Article</h1>
  {% if error %}<p class="error">{{ error }}</p>{% endif %}
  <form method="post" action="{{ url_for('edit_post', slug=article.slug) }}" class="card">
    <label>Title</label>
    <input name="title" value="{{ article.title }}" required>
    <label>Date</label>
    <input type="date" name="date" value="{{ article.date }}">
    <label>Content (Markdown)</label>
    <textarea name="content" rows="12" required>{{ article.content }}</textarea>
    <p class="muted">Slug: <code>{{ article.slug }}</code></p>
    <p>
      <button class="btn">Save</button>
      <a class="btn ghost" href="{{ url_for('dashboard') }}">Cancel</a>
    </p>
  </form>
{% endblock %}
