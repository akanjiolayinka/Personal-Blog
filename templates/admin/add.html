{% extends 'base.html' %}
{% block title %}New Article - Personal Blog{% endblock %}
{% block content %}
  <h1>New Article</h1>
  {% if error %}<p class="error">{{ error }}</p>{% endif %}
  <form method="post" action="{{ url_for('add_post') }}" class="card">
    <label>Title</label>
    <input name="title" required>
    <label>Date</label>
    <input type="date" name="date" value="{{ today }}">
    <label>Content (Markdown)</label>
    <textarea name="content" rows="12" required></textarea>
    <p>
      <button class="btn">Publish</button>
      <a class="btn ghost" href="{{ url_for('dashboard') }}">Cancel</a>
    </p>
  </form>
{% endblock %}
